<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duinvakantie Bloemendaal — 28 juli t/m 6 augustus 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F4A3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duinvakantie">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root{
    --bg:#F2EEE1;
    --surface:#FBFAF5;
    --surface-2:#E8E1CC;
    --ink:#2F4A3E;
    --text:#3C5347;
    --muted:#867D6C;
    --strike:#B3AA97;
    --accent:#5F7F4E;
    --accent-soft:#E3E9D8;
    --sage:#4C8577;
    --sage-soft:#DCEAE4;
    --gold:#C1984C;
    --line:#E1D6B9;
    --header-text:#FAF6EA;
    --shadow:0 10px 30px -14px rgba(47,74,62,0.28);
    --shadow-sm:0 3px 12px -6px rgba(47,74,62,0.22);
    --del:#A38468;
  }
  html[data-theme="dark"]{
    --bg:#171C18;
    --surface:#1F251F;
    --surface-2:#262E26;
    --ink:#DCE6DB;
    --text:#C7D1C6;
    --muted:#8D9A89;
    --strike:#5B6759;
    --accent:#8FB07A;
    --accent-soft:#263323;
    --sage:#5CA391;
    --sage-soft:#1A2E29;
    --gold:#C7A667;
    --line:#2B332B;
    --header-text:#EDE8DB;
    --shadow:0 12px 32px -14px rgba(0,0,0,0.6);
    --shadow-sm:0 4px 14px -7px rgba(0,0,0,0.55);
    --del:#B49478;
  }
  *{box-sizing:border-box;}
  body{
    margin:0 auto;
    max-width:720px;
    background:var(--bg);
    color:var(--text);
    font-family:'DM Sans',system-ui,sans-serif;
    line-height:1.55;
    padding-bottom:72px;
    box-shadow:0 0 60px -30px rgba(0,0,0,0.3);
    transition:background .3s ease, color .3s ease;
  }
  h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif;color:var(--ink);margin:0;font-weight:600;}
  .mono{font-family:'DM Mono',monospace;}

  /* ---- HERO ---- */
  header.hero{position:relative;min-height:340px;display:flex;overflow:hidden;background:linear-gradient(160deg,#2F4A3E,#182A21);}
  .hero-fallback{position:absolute;inset:0;z-index:0;}
  .hero-fallback svg{width:100%;height:100%;display:block;}
  .hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1;}
  .hero-bg.imgfail{display:none;}
  .hero-scrim{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(20,24,34,0.18) 0%,rgba(20,24,34,0.04) 30%,rgba(18,22,32,0.5) 62%,rgba(15,18,26,0.88) 100%);}
  .hero-actions{position:absolute;top:16px;right:16px;z-index:4;display:flex;gap:8px;}
  .hero-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.42);background:rgba(255,255,255,0.16);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .2s;}
  .hero-btn:hover{background:rgba(255,255,255,0.28);}
  .hero-content{position:relative;z-index:3;margin-top:auto;padding:24px 22px 26px;color:#fff;width:100%;}
  .cd-pill{display:inline-flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:12px;color:#fff;background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.32);padding:5px 13px;border-radius:999px;margin-bottom:14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  .cd-pill b{font-family:'Fraunces',serif;font-weight:600;font-size:15px;}
  header.hero .eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#fff;opacity:0.88;margin-bottom:9px;text-shadow:0 1px 8px rgba(0,0,0,0.5);}
  header.hero h1{color:#fff;font-size:37px;line-height:1.02;letter-spacing:-0.01em;text-shadow:0 2px 20px rgba(0,0,0,0.45);}
  header.hero .sub{color:#fff;opacity:0.94;margin-top:10px;font-size:14.5px;max-width:540px;text-shadow:0 1px 12px rgba(0,0,0,0.55);}

  /* ---- TABS ---- */
  nav.sections{display:flex;gap:7px;padding:16px 20px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:sticky;top:0;z-index:6;background:linear-gradient(180deg,var(--bg) 78%,rgba(251,244,233,0));}
  nav.sections::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:9px 15px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s;}
  .tab:active{transform:scale(0.96);}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}

  main{padding:14px 20px 0;}

  /* ---- LISTS ---- */
  .cat{font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin:22px 0 9px;}
  .cat:first-of-type{margin-top:8px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
  .row{padding:12px 16px;font-size:14px;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row b{color:var(--ink);font-weight:600;}
  .row a{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1.5px solid var(--accent-soft);}
  .row a:hover{border-bottom-color:var(--accent);}
  .row.two{display:flex;justify-content:space-between;gap:12px;}
  .row .qty{font-family:'DM Mono',monospace;color:var(--accent);white-space:nowrap;font-size:13px;}
  .intro{font-size:13px;color:var(--muted);margin:2px 0 4px;line-height:1.6;}

  .note-box{background:linear-gradient(135deg,var(--accent-soft),#fff0);border:1px solid var(--accent);border-radius:16px;padding:15px 17px;margin:6px 0 16px;box-shadow:var(--shadow-sm);}
  html[data-theme="dark"] .note-box{background:linear-gradient(135deg,#33241c,#33241c00);}
  .note-box h3{color:var(--accent);font-size:16px;margin-bottom:6px;display:flex;gap:8px;align-items:center;}
  .note-box p{font-size:13px;margin:6px 0 0;color:var(--text);}
  .note-box .opt{font-size:12.5px;margin-top:8px;padding-left:12px;border-left:3px solid var(--accent);color:var(--text);}

  .banner{position:relative;height:150px;border-radius:16px;overflow:hidden;margin:2px 0 16px;background:linear-gradient(135deg,var(--sage),var(--ink));box-shadow:var(--shadow);}
  .banner img{width:100%;height:100%;object-fit:cover;display:block;}
  .banner .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(15,18,26,0.72));color:#fff;font-family:'Fraunces',serif;font-weight:600;font-size:16px;padding:26px 16px 13px;}

  .photo-strip{display:grid;grid-template-columns:1fr;gap:9px;margin-bottom:6px;}
  .pf{margin:0;position:relative;height:140px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--sage),var(--ink));box-shadow:var(--shadow-sm);}
  .pf img{width:100%;height:100%;object-fit:cover;display:block;}
  .pf figcaption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,0.6));color:#fff;font-family:'DM Mono',monospace;font-size:10.5px;padding:16px 9px 7px;}

  .badge{display:inline-block;font-family:'DM Mono',monospace;font-size:10.5px;color:var(--sage);background:var(--sage-soft);padding:1px 8px;border-radius:6px;margin-left:2px;vertical-align:middle;}

  .budget-box{background:linear-gradient(135deg,var(--sage),var(--ink));color:#fff;border-radius:16px;padding:16px 18px;margin:4px 0 16px;box-shadow:var(--shadow);}
  .budget-box h3{color:#fff;font-size:17px;margin-bottom:9px;}
  .budget-box .bl{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.2);}
  .budget-box .bl:last-child{border-bottom:none;}
  .budget-box .bl.grand{font-weight:700;font-size:15px;margin-top:6px;padding-top:8px;}
  .budget-box .bl .a{font-family:'DM Mono',monospace;}

  /* ---- PACKING ---- */
  .check-row{display:flex;align-items:flex-start;gap:11px;padding:11px 15px;font-size:14px;border-bottom:1px solid var(--line);}
  .check-row:last-child{border-bottom:none;}
  .check-row input[type="checkbox"]{margin-top:2px;width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
  .check-row .check-text{flex:1;line-height:1.45;}
  .check-row .check-text b{color:var(--ink);font-weight:600;}
  .check-row.checked .check-text{text-decoration:line-through;color:var(--strike);}
  .check-row .del-btn{background:none;border:none;color:var(--del);font-size:16px;line-height:1;cursor:pointer;padding:2px 4px;flex-shrink:0;}
  .add-row{display:flex;gap:6px;padding:11px 15px;background:var(--surface-2);}
  .add-row input[type="text"]{flex:1;padding:8px 11px;border-radius:8px;border:1px solid var(--line);font-family:'DM Sans',sans-serif;font-size:13px;background:var(--surface);color:var(--text);}
  .add-row button{padding:8px 13px;border-radius:8px;border:none;background:var(--sage);color:#fff;font-weight:600;font-size:13px;cursor:pointer;}
  .pack-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 8px;}
  .reset-btn{background:none;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .progress-pill{font-family:'DM Mono',monospace;font-size:12px;background:var(--surface-2);padding:4px 10px;border-radius:8px;color:var(--ink);}
  .progressbar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:0 0 14px;}
  .progressbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .3s;}

  .credits{font-size:11px;color:var(--muted);margin-top:16px;opacity:0.85;}
  .credits a{color:var(--muted);}

  /* ---- SURPRISE MODAL ---- */
  .surprise-overlay{position:fixed;inset:0;background:rgba(20,24,34,0.55);z-index:50;display:none;align-items:center;justify-content:center;padding:24px;}
  .surprise-overlay.open{display:flex;}
  .surprise-card{background:var(--surface);border-radius:18px;padding:22px 20px;max-width:420px;width:100%;box-shadow:var(--shadow);position:relative;}
  .surprise-card h3{font-size:19px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .surprise-pick{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;}
  .surprise-pick .tag{font-family:'DM Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);display:block;margin-bottom:4px;}
  .surprise-pick b{color:var(--ink);}
  .surprise-actions{display:flex;gap:8px;margin-top:14px;}
  .surprise-actions button{flex:1;padding:10px;border-radius:10px;border:none;font-weight:600;font-size:13.5px;cursor:pointer;}
  .surprise-again{background:var(--surface-2);color:var(--ink);}
  .surprise-close{background:var(--accent);color:#fff;}

  @media print{
    .hero-actions,nav.sections,.add-row,.del-btn,.reset-btn{display:none !important;}
    body{max-width:none;box-shadow:none;}
    .card,.banner,.note-box,.budget-box{box-shadow:none;break-inside:avoid;}
    header.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }

  /* ---- DAGOVERZICHT: weer, zon & getij ---- */
  .weather-status{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--muted);margin:0 0 10px;}
  .weather-status.offline{color:var(--del);}
  .day-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin:0 0 18px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .day-strip::-webkit-scrollbar{display:none;}
  .day-card{flex:0 0 152px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow-sm);}
  .day-card .dd{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;}
  .day-card .dnum{font-family:'Fraunces',serif;font-weight:600;color:var(--ink);font-size:18px;margin:2px 0 8px;}
  .day-card .wx{font-size:12.5px;margin-bottom:6px;}
  .day-card .meta{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px;}
  .day-card .meta .t{font-weight:700;color:var(--ink);font-size:13px;}
  .day-card .sun{font-size:11px;color:var(--text);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px;}
  .day-card .tide{font-size:10px;color:var(--muted);margin-top:7px;line-height:1.45;}
  .day-card .tide a{color:var(--accent);}

  /* ---- KAART (statische PWN-kaart) ---- */
  .map-static-link{display:block;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--line);margin-bottom:2px;}
  .map-static{width:100%;height:auto;display:block;}

  /* ---- MARKTEN-KAART (Eten-tab) ---- */
  .market-map{height:240px;width:100%;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--line);margin-bottom:10px;background:var(--surface-2);}
</style>
</head>
<body>

<header class="hero">
  <img class="hero-bg" src="https://commons.wikimedia.org/wiki/Special:FilePath/Duinen%20in%20Nationaal%20Park%20Zuid-Kennemerland.jpg?width=1200" alt="Duinen in Nationaal Park Zuid-Kennemerland" onerror="this.classList.add('imgfail')">
  <div class="hero-fallback" aria-hidden="true">
    <svg viewBox="0 0 800 340" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F3E4C4"/><stop offset="55%" stop-color="#E3B98C"/><stop offset="100%" stop-color="#4C8577"/></linearGradient>
      </defs>
      <rect width="800" height="340" fill="url(#sky)"/>
      <circle cx="610" cy="110" r="52" fill="#D9B26B" opacity="0.9"/>
      <path d="M0,225 Q150,270 320,232 T660,232 T800,226 L800,340 L0,340 Z" fill="#2F4A3E" opacity="0.30"/>
      <path d="M0,255 Q120,228 240,246 T500,240 T800,248 L800,340 L0,340 Z" fill="#4C8577"/>
      <path d="M0,285 Q100,262 220,278 T460,272 T800,280 L800,340 L0,340 Z" fill="#2F4A3E"/>
    </svg>
  </div>
  <div class="hero-scrim"></div>
  <div class="hero-actions">
    <button class="hero-btn" id="surpriseBtn" title="Verras me" aria-label="Verras me met een idee">🎲</button>
    <button class="hero-btn" id="shareBtn" title="Deel met Daan" aria-label="Deel met Daan">📤</button>
    <button class="hero-btn" id="themeToggle" title="Licht / donker" aria-label="Wissel licht/donker">🌙</button>
  </div>
  <div class="hero-content">
    <div class="cd-pill" id="countdown"><span id="cdText">laden…</span></div>
    <div class="eyebrow">De Lakens · Bloemendaal aan Zee · 28 juli – 6 augustus 2026</div>
    <h1>Duin, strand &amp; zee</h1>
    <div class="sub">Losse ideeën om per dag uit te kiezen — activiteiten, eten, koffie, koopjes en inpakken. Voor Imke &amp; Daan.</div>
  </div>
</header>

<nav class="sections">
  <button class="tab active" data-target="act">Activiteiten</button>
  <button class="tab" data-target="eten">Eten</button>
  <button class="tab" data-target="coffee">Koffie &amp; Lunch</button>
  <button class="tab" data-target="deals">Voordelig</button>
  <button class="tab" data-target="pack">Inpakken</button>
</nav>

<main>
  <div id="actWrap"></div>
  <div id="etenWrap" style="display:none;"></div>
  <div id="coffeeWrap" style="display:none;"></div>
  <div id="dealsWrap" style="display:none;"></div>
  <div id="packWrap" style="display:none;"></div>
</main>

<div class="surprise-overlay" id="surpriseOverlay">
  <div class="surprise-card">
    <h3>🎲 Zin in vandaag?</h3>
    <div id="surpriseContent"></div>
    <div class="surprise-actions">
      <button class="surprise-again" onclick="surpriseMe()">Nog een keer</button>
      <button class="surprise-close" onclick="closeSurprise()">Prima, gaan we doen</button>
    </div>
  </div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
const ACTIVITIES = {
  "Wandelroutes":[
    ["Kennemerduinen — Vogelmeer &amp; Kraansvlak","Direct vanaf de camping het duin in. Kort rondje (~5 km) via het Vogelmeer, of langer richting het Bloemendaalse Bos. In het Kraansvlak-gebied lopen het hele jaar wilde paarden en Schotse hooglanders. Let op: de Wisentenroute (bizons) is 's zomers gesloten (alleen 1 sep–eind feb). GPX &amp; kaart: <a href=\"https://www.alltrails.com/trail/netherlands/north-holland/ns-wandeling-kennemerduinen\" target=\"_blank\" rel=\"noopener\">AllTrails</a> · <a href=\"https://www.wandelnetwerknoordholland.nl/startpunten/routes-vanaf-dit-startpunt/2628\" target=\"_blank\" rel=\"noopener\">Wandelnetwerk Bloemendaal</a>."],
    ["Lange duinhike Koevlak–Parnassia (~12-14 km)","Stevige route door duinvalleien, terug via het strand met de voeten in het water. Verrekijker mee voor grazers, reeën en vogels. GPX: <a href=\"https://www.alltrails.com/trail/netherlands/north-holland/kennemerduinen-koevlak-parnassia\" target=\"_blank\" rel=\"noopener\">AllTrails Koevlak–Parnassia</a>."],
    ["Amsterdamse Waterleidingduinen — ingang De Zilk","Rustige, zuidelijke ingang. Damherten en vossen spotten, of de historische WOII-bunkerroute lopen. Kleine entree. <a href=\"http://awd.waternet.nl/\" target=\"_blank\" rel=\"noopener\">Routekaart awd.waternet.nl</a>."],
    ["Strandwandeling Bloemendaal–Zandvoort v.v. (~10 km)","Juist een fijne route bij wat wind. Breed strand, veel lucht. Onderweg een strandtent voor koffie of een borrel."],
    ["Noordvoort &amp; Strandpaal 64","Ongerept strandreservaat tussen Zandvoort en Noordwijk — heel breed en leeg, geen honden. Paal 64 is een stil 'geheim' stuk strand."],
    ["Hofjeswandeling Haarlem","Verborgen middeleeuwse binnentuinen zoals het Hofje van Bakenes — oases van stilte, vlak bij de Grote Markt. Mooi te combineren met de fietsroute naar de stad."],
    ["Amsterdam-Noord wandeling","NDSM-werf (streetart, loodsen) → langs het IJ naar EYE → door het Vliegenbos naar dorpje Nieuwendam; eventueel door naar Het Twiske (Schotse hooglanders). Route: <a href=\"https://www.iamsterdam.com/zien-en-doen/natuur-en-actief/routes/wandelroute-door-ndsm\" target=\"_blank\" rel=\"noopener\">I amsterdam</a> · <a href=\"https://www.wikiloc.com/hiking-trails/verrassend-amsterdam-noord-13667750\" target=\"_blank\" rel=\"noopener\">Wikiloc GPX</a>. Niet op 1 aug (Canal Parade, extreem druk)."],
    ["Amsterdam-Oost, minder standaard (~6 km)","Voor als het centrum en de bekende wijken al bekend terrein zijn: start bij de Dappermarkt, loop de Javastraat door (Indische buurt, multicultureel en veel eetadresjes), door naar het Oosterpark (Verzetsmuseum en Tropenmuseum liggen aan de rand), en eindig bij het rustige Flevopark aan het water — heel andere sfeer dan de grachtengordel, nauwelijks toeristen."],
  ],
  "Fietsroutes":[
    ["Duin naar stad → Haarlem","Via de Zeeweg en Brouwerskolkweg rechtstreeks vanaf de camping naar de historische binnenstad, ± 20 minuten."],
    ["Bloemendaal → Zandvoort boulevard (~10 km)","Langs zee, mooi in de ochtend, met een duik in zee als tussenstop."],
    ["Buitenplaatsen-tocht (~35 km)","Door de duinen noordwaarts naar Landgoed Beeckestijn (Franse &amp; Engelse tuinen) en terug via de indrukwekkende sluizen van IJmuiden. Een hele dag fietsen."],
    ["Fort bij Vijfhuizen — Stelling van Amsterdam","UNESCO-fort in het polderland ten oosten van Haarlem, met kunst en een café. Leuke rit door weiland en langs water."],
    ["Kraansvlak-stop","Onderweg op de Zandvoort-route: even stoppen bij het uitkijkpunt voor wilde paarden of hooglanders."],

/* ---------- ZON OP/ONDER (lokale berekening, geen API nodig) ----------
   Compacte implementatie van de bekende NOAA-zonformule (zoals ook in
   SunCalc gebruikt wordt) — volledig offline, alleen datum + coördinaten
   nodig. Geverifieerd tegen bekende zonstanden voor Nederland eind juli/
   begin augustus. */
const CAMP_LAT = 52.401, CAMP_LON = 4.582;
(function(){
  const rad = Math.PI/180, dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, e = rad*23.4397;
  const toJulian = date => date.valueOf()/dayMs - 0.5 + J1970;
  const fromJulian = j => new Date((j + 0.5 - J1970) * dayMs);
  const toDays = date => toJulian(date) - J2000;
  const solarMeanAnomaly = d => rad*(357.5291 + 0.98560028*d);
  const eclipticLongitude = M => M + rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M)) + rad*102.9372 + Math.PI;
  const declination = l => Math.asin(Math.sin(e)*Math.sin(l));
  const julianCycle = (d,lw) => Math.round(d - 0.0009 - lw/(2*Math.PI));
  const approxTransit = (Ht,lw,n) => 0.0009 + (Ht+lw)/(2*Math.PI) + n;
  const solarTransitJ = (ds,M,L) => J2000 + ds + 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L);
  const hourAngle = (h,phi,d) => Math.acos((Math.sin(h)-Math.sin(phi)*Math.sin(d))/(Math.cos(phi)*Math.cos(d)));
  window.solarTimes = function(date, lat, lng){
    const lw = rad*-lng, phi = rad*lat, d = toDays(date);
    const n = julianCycle(d,lw), ds = approxTransit(0,lw,n);
    const M = solarMeanAnomaly(ds), L = eclipticLongitude(M), dec = declination(L);
    const Jnoon = solarTransitJ(ds,M,L);
    const w = hourAngle(-0.833*rad, phi, dec);
    const Jset = solarTransitJ(approxTransit(w,lw,n), M, L);
    const Jrise = Jnoon - (Jset - Jnoon);
    return { sunrise: fromJulian(Jrise), sunset: fromJulian(Jset) };
  };
})();
function sunTimesFor(dateStr){
  const t = window.solarTimes(new Date(dateStr+"T12:00:00Z"), CAMP_LAT, CAMP_LON);
  const fmt = dt => dt.toLocaleTimeString('nl-NL',{timeZone:'Europe/Amsterdam',hour:'2-digit',minute:'2-digit'});
  return { sunrise: fmt(t.sunrise), sunset: fmt(t.sunset) };
}

/* ---------- LIVE WEER (Open-Meteo, geen API-key) ---------- */
const VACATION_START = "2026-07-28", VACATION_END = "2026-08-06";
const VACATION_DAYS = (function(){
  const days=[]; const d=new Date(VACATION_START+"T12:00:00"); const end=new Date(VACATION_END+"T12:00:00");
  while(d<=end){ days.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return days;
})();
const WX_CACHE_KEY = "duinvakantie-weer-v1";
const WX_CODES = {0:'☀️ Helder',1:'🌤️ Overwegend zonnig',2:'⛅ Half bewolkt',3:'☁️ Bewolkt',45:'🌫️ Mist',48:'🌫️ Mist',51:'🌦️ Motregen',53:'🌦️ Motregen',55:'🌦️ Motregen',56:'🌧️ IJzel-motregen',57:'🌧️ IJzel-motregen',61:'🌧️ Regen',63:'🌧️ Regen',65:'🌧️ Regen',66:'🌧️ IJzelregen',67:'🌧️ IJzelregen',71:'🌨️ Sneeuw',73:'🌨️ Sneeuw',75:'🌨️ Sneeuw',77:'🌨️ Sneeuwkorrels',80:'🌦️ Buien',81:'🌦️ Buien',82:'🌧️ Zware buien',85:'🌨️ Sneeuwbuien',86:'🌨️ Sneeuwbuien',95:'⛈️ Onweer',96:'⛈️ Onweer + hagel',99:'⛈️ Onweer + hagel'};
function wxLabel(code){ return WX_CODES[code] || '🌡️ Onbekend'; }
function beaufort(kmh){ const t=[1,6,12,20,29,39,50,62,75,89,103,118]; for(let b=0;b<t.length;b++){ if(kmh<t[b]) return b; } return 12; }
async function fetchWeather(){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${CAMP_LAT}&longitude=${CAMP_LON}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=Europe%2FAmsterdam&forecast_days=16`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('weer-ophalen mislukt');
  const data = await res.json();
  const daily = data.daily;
  const codes = daily.weather_code || daily.weathercode;
  const wind = daily.wind_speed_10m_max || daily.windspeed_10m_max;
  const days = {};
  daily.time.forEach((date,i)=>{
    days[date] = { code:codes[i], tmax:Math.round(daily.temperature_2m_max[i]), tmin:Math.round(daily.temperature_2m_min[i]), precip:daily.precipitation_probability_max[i], wind:Math.round(wind[i]) };
  });
  const payload = { fetchedAt: Date.now(), days };
  try{ localStorage.setItem(WX_CACHE_KEY, JSON.stringify(payload)); }catch(e){}
  return payload;
}
function loadCachedWeather(){ try{ const r=localStorage.getItem(WX_CACHE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function timeAgo(ts){
  const min = Math.round((Date.now()-ts)/60000);
  if(min<1) return 'zojuist';
  if(min<60) return `${min} min geleden`;
  const h = Math.round(min/60);
  if(h<24) return `${h} uur geleden`;
  return `${Math.round(h/24)} dag(en) geleden`;
}
async function renderDayOverview(){
  const el = document.getElementById('dayOverview');
  let wx = null, status = 'none';
  try{ wx = await fetchWeather(); status = 'ok'; }
  catch(e){ const cached = loadCachedWeather(); if(cached){ wx = cached; status = 'cached'; } }

  const cards = VACATION_DAYS.map(dateStr=>{
    const d = new Date(dateStr+'T12:00:00');
    const dd = d.toLocaleDateString('nl-NL',{weekday:'short'});
    const dnum = d.toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit'});
    const sun = sunTimesFor(dateStr);
    const dayWx = wx && wx.days ? wx.days[dateStr] : null;
    let wxHtml;
    if(dayWx){
      wxHtml = `<div class="wx">${wxLabel(dayWx.code)}</div>
        <div class="meta"><span class="t">${dayWx.tmin}° – ${dayWx.tmax}°C</span><span>☔ ${dayWx.precip}% neerslagkans</span><span>💨 wind ${beaufort(dayWx.wind)} Bft</span></div>`;
    } else if(status==='none'){
      wxHtml = `<div class="wx" style="color:var(--muted)">geen verbinding — nog geen data</div>`;
    } else {
      wxHtml = `<div class="wx" style="color:var(--muted)">nog geen voorspelling (te ver vooruit)</div>`;
    }
    return `<div class="day-card">
      <div class="dd">${dd}</div>
      <div class="dnum">${dnum}</div>
      ${wxHtml}
      <div class="sun"><span>🌅 op ${sun.sunrise}</span><span>🌇 onder ${sun.sunset}</span></div>
      <div class="tide">🌊 Getij: check <a href="https://waterinfo.rws.nl/" target="_blank" rel="noopener">Rijkswaterstaat Waterinfo</a> (zoek Zandvoort/IJmuiden) of de reddingsbrigade op het strand voor de actuele tafel.</div>
    </div>`;
  }).join('');

  const statusLine = status==='ok'
    ? `<div class="weather-status">Weer via Open-Meteo · bijgewerkt ${timeAgo(wx.fetchedAt)}</div>`
    : status==='cached'
      ? `<div class="weather-status offline">📴 Geen actuele verbinding — laatst bekende weerdata van ${timeAgo(wx.fetchedAt)}</div>`
      : `<div class="weather-status offline">📴 Geen verbinding en nog geen eerdere weerdata opgeslagen.</div>`;

  el.innerHTML = `<div class="cat">Dagoverzicht — weer, zon &amp; getij</div>${statusLine}<div class="day-strip">${cards}</div>`;
}

/* ---------- COUNTDOWN ---------- */
function renderCountdown(){
  const start = new Date("2026-07-28T00:00:00+02:00");
  const end = new Date("2026-08-06T23:59:59+02:00");
  const now = new Date();
  const el = document.getElementById("cdText");
  if(!el) return;
  const d = 86400000;
  if(now < start){ const n = Math.ceil((start-now)/d); el.innerHTML = `🌊 nog <b>${n}</b> ${n===1?"dag":"dagen"} tot vertrek`; }
  else if(now <= end){ const n = Math.floor((now-start)/d)+1; el.innerHTML = `🏖️ dag <b>${n}</b> van 10 · geniet ervan!`; }
  else { el.innerHTML = `tot de volgende keer ♥`; }
}

/* ---------- GENERIEKE LIJST ---------- */
function listHtml(obj){
  let html = "";
  for(const [cat, items] of Object.entries(obj)){
    const rows = items.map(([name, why])=>`<div class="row"><b>${name}</b>${why?` — ${why}`:""}</div>`).join("");
    html += `<div class="cat">${cat}</div><div class="card">${rows}</div>`;
  }
  return html;
}

      <figure class="pf">
        <svg viewBox="0 0 200 110" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kennemerduinen">

function renderMarketMap(){
  const marketRows = MARKETS.map(m=>`<div class="row"><b>${m.name}</b> — ${m.info}</div>`).join("");
  const textOnlyRows = MARKETS_TEXT_ONLY.map(([n,w])=>`<div class="row"><b>${n}</b> — ${w}</div>`).join("");

    <div class="cat">Markten &amp; supermarkten</div>
    <div id="marketMap" class="market-map"></div>
    <div class="card">${marketRows}${textOnlyRows}</div>`;

  const marketMap = L.map('marketMap', { scrollWheelZoom:false }).setView([52.392,4.585], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:18,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-bijdragers'
  }).addTo(marketMap);
  MARKETS.forEach(m=>{
    L.marker(m.coords).bindPopup(`<b>${m.name}</b><br>${m.info}`).addTo(marketMap);

}

/* ---------- PACKING (localStorage) ---------- */
const PACK_KEY = "duinvakantie-paklijst-2026-v3";
let packState = null;
function defaultPack(){ const s={}; for(const [c,items] of Object.entries(PACKING)) s[c]=items.map(([t,w])=>({text:t,note:w,checked:false})); return s; }
function loadPack(){ if(packState) return packState; try{ const r=localStorage.getItem(PACK_KEY); packState=r?JSON.parse(r):defaultPack(); }catch(e){ packState=defaultPack(); } return packState; }
function savePack(){ try{ localStorage.setItem(PACK_KEY, JSON.stringify(packState)); }catch(e){} }
function packProgress(){ let t=0,d=0; for(const it of Object.values(packState)){ t+=it.length; d+=it.filter(i=>i.checked).length; } return {d,t,pct:t?Math.round(d/t*100):0}; }
function renderPack(){
  loadPack();
  let html="";
  for(const [cat, items] of Object.entries(packState)){
    const rows = items.map((item,idx)=>`
      <div class="check-row ${item.checked?'checked':''}">
        <input type="checkbox" ${item.checked?'checked':''} onchange="togglePack('${cat.replace(/'/g,"\\'")}',${idx})">
        <div class="check-text"><b>${item.text}</b>${item.note?' — '+item.note:''}</div>
        <button class="del-btn" onclick="delPack('${cat.replace(/'/g,"\\'")}',${idx})" title="Verwijderen">✕</button>
      </div>`).join("");
    const id='add-'+cat.replace(/[^a-zA-Z0-9]/g,'');
    html += `<div class="cat">${cat}</div><div class="card">${rows}
      <div class="add-row"><input type="text" placeholder="Zelf item toevoegen..." id="${id}" onkeydown="if(event.key==='Enter')addPack('${cat.replace(/'/g,"\\'")}','${id}')">
      <button onclick="addPack('${cat.replace(/'/g,"\\'")}','${id}')">+ Toevoegen</button></div></div>`;
  }
  const p=packProgress();
  document.getElementById("packWrap").innerHTML=`
    <div class="intro">Vink af wat is ingepakt, of pas de lijst zelf aan — dit blijft bewaard in je browser. De tent-hacks zijn afgestemd op jullie Quechua Air Seconds 4.1 F&B.</div>
    <div class="pack-top"><span class="progress-pill">${p.d}/${p.t} · ${p.pct}%</span><button class="reset-btn" onclick="resetPack()">Reset lijst</button></div>
    <div class="progressbar"><span style="width:${p.pct}%"></span></div>${html}`;
}
function togglePack(c,i){ packState[c][i].checked=!packState[c][i].checked; savePack(); renderPack(); }
function delPack(c,i){ packState[c].splice(i,1); savePack(); renderPack(); }
function addPack(c,id){ const el=document.getElementById(id); const v=el.value.trim(); if(!v)return; packState[c].push({text:v,note:"",checked:false}); savePack(); renderPack(); }
function resetPack(){ if(!confirm("Paklijst terugzetten naar standaard? Je eigen vinkjes en toevoegingen gaan verloren.")) return; packState=defaultPack(); savePack(); renderPack(); }

/* ---------- VERRAS ME ---------- */
function pickRandom(obj){
  const cats = Object.keys(obj);
  const cat = cats[Math.floor(Math.random()*cats.length)];
  const items = obj[cat];
  const item = items[Math.floor(Math.random()*items.length)];
  return {cat, name:item[0], why:item[1]};
}
function surpriseMe(){
  const a = pickRandom(ACTIVITIES);
  const e = pickRandom(ETEN);
  document.getElementById("surpriseContent").innerHTML = `
    <div class="surprise-pick"><span class="tag">${a.cat}</span><b>${a.name}</b>${a.why?` — ${a.why}`:""}</div>
    <div class="surprise-pick"><span class="tag">${e.cat}</span><b>${e.name}</b>${e.why?` — ${e.why}`:""}</div>
  `;
  document.getElementById("surpriseOverlay").classList.add("open");
}
function closeSurprise(){ document.getElementById("surpriseOverlay").classList.remove("open"); }
document.getElementById("surpriseBtn").onclick = surpriseMe;

/* ---------- THEME ---------- */
const THEME_KEY="duinvakantie-theme";
function applyTheme(t){ document.documentElement.setAttribute("data-theme",t); document.getElementById("themeToggle").textContent = t==="dark"?"☀️":"🌙"; }
(function(){ let t="light"; try{ t=localStorage.getItem(THEME_KEY)||"light"; }catch(e){} applyTheme(t); })();
document.getElementById("themeToggle").onclick=()=>{ const c=document.documentElement.getAttribute("data-theme"); const n=c==="dark"?"light":"dark"; applyTheme(n); try{localStorage.setItem(THEME_KEY,n);}catch(e){} };

/* ---------- DELEN ---------- */
document.getElementById("shareBtn").onclick=async()=>{
  const msg="Onze duinvakantie-planner (28 juli–6 aug, De Lakens): losse ideeën voor activiteiten, eten, koffie, koopjes en inpakken. Open het HTML-bestand in je browser — je eigen paklijst-vinkjes blijven apart bewaard. 🏖️";
  try{ if(navigator.share){ await navigator.share({title:"Duinvakantie-planner", text:msg}); return; } }catch(e){}
  try{ await navigator.clipboard.writeText(msg); alert("Berichtje voor Daan gekopieerd! ✅\n\nPlak het in WhatsApp en stuur dit HTML-bestand mee — dan opent Daan zijn eigen kopie."); }
  catch(e){ alert("Deel de planner met Daan door dit HTML-bestand te sturen (WhatsApp, mail of AirDrop). Hij opent het in zijn browser."); }
};

/* ---------- SECTIES ---------- */
const RENDERED = {};
function show(s){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active", b.dataset.target===s));
  const map={act:"actWrap",eten:"etenWrap",coffee:"coffeeWrap",deals:"dealsWrap",pack:"packWrap"};
  for(const [k,id] of Object.entries(map)) document.getElementById(id).style.display = (k===s)?"block":"none";
  if(!RENDERED[s]){
    ({act:renderAct,eten:renderEten,coffee:renderCoffee,deals:renderDeals,pack:renderPack}[s])();
    if(s!=="pack") RENDERED[s]=true; // pack altijd herrenderen voor voortgang
  } else if(s==="pack"){ renderPack(); }
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll(".tab").forEach(b=>{ b.onclick=()=>show(b.dataset.target); });

/* ---------- INIT ---------- */
renderCountdown();
renderAct();
RENDERED.act = true;

/* ---------- SERVICE WORKER (offline/PWA) ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
